[xfi-guard]
backend = auto
banaction = ufw
bantime = 604800
findtime = 600
maxretry = 5
# XFI Guard consumes SSH events itself; this jail is used as the authoritative
# seven-day enforcement/synchronization jail when events are fed to its filter.
filter = xfi-guard
port = ssh
logpath = /var/log/auth.log
ignoreip = 127.0.0.1/8 ::1
