# XFI Guard multi-VPS threat sharing
# Copy to config.toml and fill a random secret on every trusted node.

[cluster]
enabled = false
node_id = "vps-01"
role = "master" # master | agent
secret = "CHANGE_ME_TO_A_LONG_RANDOM_SECRET"
max_event_age_seconds = 300
# Never share private/reserved addresses; they are rejected by the cluster layer.

# Trusted nodes are configured outside this example when transport is added.
