[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xfi-guard"
version = "0.1.1"
description = "Security and monitoring toolkit for VPS infrastructure"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.20,<4",
]

[project.scripts]
xfi-guard = "xfi_guard.cli:main"
xfi-guard-daemon = "xfi_guard.daemon:main"
