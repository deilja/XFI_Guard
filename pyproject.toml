[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xfi-guard"
version = "0.1.3"
description = "Security and monitoring toolkit for VPS infrastructure"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.22,<4",
    "aiohttp>=3.9,<4",
    "pydantic>=2.7,<3",
]

[tool.setuptools.packages.find]
include = ["xfi_guard*"]
exclude = ["systemd*"]

[project.scripts]
xfi-guard = "xfi_guard.cli:main"
xfi-guard-daemon = "xfi_guard.daemon:main"
