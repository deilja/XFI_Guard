# Example for ger.deilja.online.
# TLS is terminated by Nginx; the bot listens on 127.0.0.1:8080.
# Keep the secret in /etc/xfi-guard/bot.env, not in this file.

server {
    listen 443 ssl http2;
    server_name ger.deilja.online;

    # Use the existing certificate paths on the server.
    ssl_certificate /etc/letsencrypt/live/ger.deilja.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ger.deilja.online/privkey.pem;

    location = /xfi-guard/webhook {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8080;
    }
}
