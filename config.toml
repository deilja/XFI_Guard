[monitor]
interval_seconds = 60
log_level = "INFO"
output_file = "/var/log/xfi-guard/monitor.jsonl"
state_file = "/var/lib/xfi-guard/state.json"

[thresholds]
disk_warning_percent = 85
memory_warning_percent = 90

[vpn]
services = ["xray", "x-ui", "3x-ui"]
ports = [22, 80, 443, 2053, 2083, 2087, 2096]

[events]
ssh_log = "/var/log/auth.log"
fail2ban_log = "/var/log/fail2ban.log"
max_events_per_cycle = 100

[telegram]
enabled = false
cooldown_seconds = 300

[ai]
provider = "gemini"
max_events_per_cycle = 10

[auto_block]
# Automatic blocking requires >= 5 fresh SSH failures from the same public IP,
# AI high/critical consensus and confidence >= 0.90.
enabled = true
confidence = 0.90
min_attempts = 5
db = "/var/lib/xfi-guard/security.db"
